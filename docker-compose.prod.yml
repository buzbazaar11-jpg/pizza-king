# Hostinger KVM 4 — full stack: frontend (nginx) + FastAPI
services:
  api:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    expose: ["8000"]
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${PUBLIC_URL}
    restart: unless-stopped
    depends_on: [api]
    ports: ["8081:80"]
